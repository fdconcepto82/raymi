<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | raymi</title>
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #000;
        }

        html {
            height: -webkit-fill-available;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100vw;
        }

        /* Camera background */
        #video-canvas {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 0 !important;
            display: block;
            background: #000;
        }

        /* Unity renders transparently above the camera */
        #unity-container {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1 !important;
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
            display: block;
        }

        #webcam-video {
            position: fixed !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            left: -10px !important;
            top: -10px !important;
        }

        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: rgba(255,255,255,.93);
            z-index: 99;
        }

        #errorDiv {
            background: rgba(80,80,80,.96);
        }

        #errorText {
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <!-- There must be only ONE video-canvas. -->
    <video id="webcam-video" muted autoplay playsinline></video>
    <canvas id="video-canvas"></canvas>

    <div id="startARDiv" class="ctaDiv">
        <select id="chooseCamSel" style="display:none" onchange="SelectCam()"></select>
        <p style="text-align:center;width:70vw">
            This augmented reality experience requires access to your device's camera and motion sensors
        </p>
        <button id="startARButton" style="display:none" onclick="StartAR()">ALLOW ACCESS</button>
    </div>

    <div id="screenshotDiv" style="display:none" class="ctaDiv">
        <div style="position:relative;background-color:white;padding:10px;box-shadow:0 4px 8px 0 rgba(0,0,0,.3),0 6px 20px 0 rgba(0,0,0,.25)">
            <img id="screenshotImg" src="" alt="screenshot" style="width:80vw;height:80vh">
            <button onclick="document.getElementById('screenshotDiv').style.display='none';"
                    style="position:absolute;transform:translateY(-100%);right:0;top:0">Close</button>
        </div>
    </div>

    <div id="errorDiv" class="ctaDiv" style="display:none">
        <p id="errorText" style="text-align:center;width:80vw;color:white"></p>
        <button onclick="document.getElementById('errorDiv').style.display='none'">Close</button>
    </div>

    <div id="unity-container" class="unity-mobile">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <script src="arcamera.js" type="text/javascript"></script>
    <script src="wtracker.js" type="text/javascript"></script>
    <script src="Build/raymi.loader.js"></script>

    <script>
        var unityCanvas = document.querySelector("#unity-canvas");
        var videoCanvas = document.querySelector("#video-canvas");

        window.arCamera = new ARCamera(unityCanvas, videoCanvas);
        window.wTracker = new WorldTracker(window.arCamera);

        window.unityFacingMode = "environment";

        window.WEBCAM_SETTINGS = {
            video: {
                facingMode: { ideal: unityFacingMode },
                width: { ideal: 1280 },
                height: { ideal: 960 }
            },
            audio: false
        };

        window.webcamStream = null;
        window.requestingForCameraPermission = false;
        window.cameraStartPromise = null;
        window.cameraStarted = false;

        async function initialize() {
            try {
                await wTracker.initialize("./opencv.js");
                console.log("[Raymi] World tracker initialized.");
            } catch (error) {
                console.error("[Raymi] World tracker initialization failed:", error);
                ShowError("Failed to initialize the World Tracker.\n" + error);
                return;
            }

            try {
                await LoadWebcams();
            } catch (error) {
                console.warn("[Raymi] Camera enumeration warning:", error);
            }

            document.getElementById("startARButton").style.display = "block";
        }

        initialize();

        /*
         * IMPORTANT FIX:
         * Request the camera from the user's button gesture BEFORE Unity starts.
         * The previous build requested it only after createUnityInstance(), which
         * can race with Unity's native ARCamera.StartCamera call on iOS.
         */
        async function RequestWebcam() {
            if (window.webcamStream) return window.webcamStream;

            if (window.cameraStartPromise) {
                return window.cameraStartPromise;
            }

            window.requestingForCameraPermission = true;

            window.cameraStartPromise = (async () => {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        throw new Error("Camera API is not available in this browser/context.");
                    }

                    window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);

                    /*
                     * DO NOT call arCamera.setFlipped() here.
                     * ARCamera.setFlipped() calls window.unityInstance.SendMessage(),
                     * but Unity has not been created yet at this point.
                     * We apply the flip after createUnityInstance() below.
                     */

                    const video = document.querySelector("#webcam-video");
                    video.srcObject = window.webcamStream;
                    video.setAttribute("playsinline", "");
                    video.muted = true;

                    try {
                        await video.play();
                    } catch (playError) {
                        console.warn("[Raymi] video.play() warning:", playError);
                    }

                    console.log("[Raymi] Camera permission granted.",
                        "tracks:", window.webcamStream.getVideoTracks().length,
                        "settings:", window.webcamStream.getVideoTracks()[0]?.getSettings?.());

                    return window.webcamStream;
                } catch (err) {
                    console.error("[Raymi] getUserMedia error:", err);
                    window.webcamStream = null;
                    throw err;
                } finally {
                    window.requestingForCameraPermission = false;
                }
            })();

            try {
                return await window.cameraStartPromise;
            } catch (err) {
                window.cameraStartPromise = null;
                ShowError("Failed to start the camera.\n" + (err?.message || err));
                throw err;
            }
        }

        async function StartAR() {
            const button = document.getElementById("startARButton");
            button.disabled = true;

            try {
                /*
                 * iOS motion permission must also originate from a user gesture.
                 * Start it before waiting for camera permission.
                 */
                StartMotionSensors();
                StartGPS();

                /* Camera is requested while this function still belongs to the click gesture. */
                await RequestWebcam();

                document.getElementById("startARDiv").style.display = "none";

                unityCanvas.style.width = window.innerWidth + "px";
                unityCanvas.style.height = window.innerHeight + "px";

                const loadingBar = document.querySelector("#unity-loading-bar");
                const progressBarFull = document.querySelector("#unity-progress-bar-full");
                loadingBar.style.display = "block";

                const unityInstance = await createUnityInstance(unityCanvas, {
                    dataUrl: "Build/raymi.data",
                    frameworkUrl: "Build/raymi.framework.js",
                    codeUrl: "Build/raymi.wasm",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "DefaultCompany",
                    productName: "raymi",
                    productVersion: "0.1.0"
                }, (progress) => {
                    progressBarFull.style.width = (100 * progress) + "%";
                });

                window.unityInstance = unityInstance;

                /*
                 * Unity now exists, so ARCamera.setFlipped() is safe.
                 */
                if (window.arCamera) {
                    arCamera.setFlipped(unityFacingMode === "user");
                }

                loadingBar.style.display = "none";

                console.log("[Raymi] Unity initialized.");

                /*
                 * Unity normally calls StartWebcam through _WebGLStartCamera().
                 * Calling it here as well is safe because cameraStarted prevents
                 * duplicate starts and also makes the page robust against timing
                 * differences between Unity versions.
                 */
                await StartWebcam();

            } catch (err) {
                console.error("[Raymi] StartAR failed:", err);
                ShowError("WebAR failed to start.\n" + (err?.message || err));
                button.disabled = false;
            }
        }

        async function StartWebcam() {
            if (window.cameraStarted) {
                return;
            }

            while (window.requestingForCameraPermission) {
                await new Promise(resolve => setTimeout(resolve, 50));
            }

            if (!window.webcamStream) {
                throw new Error("Camera stream was not created.");
            }

            if (!window.unityInstance) {
                throw new Error("Unity instance is not ready.");
            }

            if (window.cameraStarted) return;

            const video = document.querySelector("#webcam-video");
            video.srcObject = window.webcamStream;

            try {
                await arCamera.startWebcam(video);
                window.cameraStarted = true;

                console.log("[Raymi] ARCamera started successfully.",
                    "video:", video.videoWidth + "x" + video.videoHeight,
                    "canvas:", videoCanvas.width + "x" + videoCanvas.height,
                    "unityInstance:", !!window.unityInstance);

                window.unityInstance.SendMessage("ARCamera", "OnStartWebcamSuccess");
            } catch (err) {
                console.error("[Raymi] ARCamera.startWebcam failed:", err);
                window.unityInstance.SendMessage("ARCamera", "OnStartWebcamFail");
                throw err;
            }
        }

        async function LoadWebcams() {
            let devices = await navigator.mediaDevices.enumerateDevices();
            let camDevices = devices.filter(d => d.kind === "videoinput");

            var select = document.getElementById("chooseCamSel");
            select.innerHTML = "";

            camDevices.forEach((mediaDevice, count) => {
                const option = document.createElement("option");
                option.value = mediaDevice.deviceId;
                option.textContent = mediaDevice.label || ("Camera " + count);
                select.appendChild(option);
            });

            if (select.options.length > 0) {
                wTracker.WEBCAM_NAME = select.options[select.selectedIndex].textContent;
            }
        }

        function SelectCam() {
            var select = document.getElementById("chooseCamSel");
            window.deviceId = select.value;

            if (deviceId) {
                window.WEBCAM_SETTINGS.video.deviceId = { exact: deviceId };
                delete window.WEBCAM_SETTINGS.video.facingMode;
            }

            if (select.selectedIndex >= 0) {
                wTracker.WEBCAM_NAME = select.options[select.selectedIndex].textContent;
            }
        }

        async function FlipCam() {
            if (window.webcamStream) {
                arCamera.stopWebcam();
                window.webcamStream = null;
                window.cameraStarted = false;
            }

            delete window.WEBCAM_SETTINGS.video.deviceId;

            if (window.WEBCAM_SETTINGS.video.facingMode === "user") {
                window.WEBCAM_SETTINGS.video.facingMode = { ideal: "environment" };
                arCamera.setFlipped(false);
            } else {
                window.WEBCAM_SETTINGS.video.facingMode = { ideal: "user" };
                arCamera.setFlipped(true);
            }

            await RequestWebcam();
            await StartWebcam();
        }

        function StartMotionSensors() {
            window.wTracker.startAngles()
                .then(() => console.log("[Raymi] Motion sensors started."))
                .catch(error => {
                    console.error("[Raymi] Motion sensor error:", error);
                    ShowError("Motion sensor error.\n" + error);
                });
        }

        function StartGPS() {
            window.wTracker.startGPS()
                .then(pos => console.log("[Raymi] GPS started.", pos))
                .catch(error => console.warn("[Raymi] GPS warning:", error));
        }

        function ShowError(error) {
            document.getElementById("errorDiv").style.display = "flex";
            document.getElementById("errorText").textContent = error;
        }

        function ShowScreenshot(dataUrl) {
            document.getElementById("screenshotDiv").style.display = "flex";
            document.getElementById("screenshotImg").src = dataUrl;
            document.getElementById("screenshotImg").style.width = "80vw";
            document.getElementById("screenshotImg").style.height =
                (80 / window.innerWidth * window.innerHeight) + "vw";
        }
    </script>
</body>
</html>
